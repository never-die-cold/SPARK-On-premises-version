name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
          - { goos: android, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build spark-agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "spark-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
          chmod +x "spark-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          files: agent/spark-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
