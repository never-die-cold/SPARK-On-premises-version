[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-onprem"
version = "0.1.0"
description = "SPARK On-premises: orchestrate idle personal devices into one OpenAI-compatible LLM cluster"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "never-die-cold" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
master = ["uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
spark = "spark.cli:main"

[tool.setuptools.packages.find]
include = ["spark*"]

[tool.setuptools.package-data]
"spark.master" = ["dashboard/*", "models.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
